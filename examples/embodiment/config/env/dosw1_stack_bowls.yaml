env_type: realworld

total_num_envs: null

auto_reset: True
ignore_terminations: False
reward_mode: raw
wrap_obs_mode: simple
seed: 0
group_size: 1
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 100
max_episode_steps: 1000
use_spacemouse: False
keyboard_intervention_wrapper: False
no_gripper: False
main_image_key: cam_front
enable_camera_player: False

state_keys:
  - left_joint_positions
  - left_gripper
  - right_joint_positions
  - right_gripper

video_cfg:
  save_video: False
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  id: "DOSW1StackBowlsEnv-v1"
  num_envs: null
